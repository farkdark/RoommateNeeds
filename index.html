<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --primary: #007bff; --text: #333; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: var(--text); }
        .container { padding: 20px; max-width: 500px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #e9ecef; color: var(--text); }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; padding: 20px; overflow-y: auto; color: white; }
        .history-card { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; text-align: left; border-left: 4px solid var(--primary); }
        .fab { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .badge { background: gold; color: black; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="titleHeader" style="cursor: pointer;">WATER SYSTEM</h2>
    
    <div id="duty-card" class="card">
        <h3>ON DUTY</h3>
        <h1 id="activeMember">Loading...</h1>
        <div class="btn-group">
            <button class="btn-primary" onclick="handleAction('REFILLED')">REFILLED</button>
            <button class="btn-secondary" onclick="handleAction('SKIP')">SKIP</button>
        </div>
        <button class="btn-secondary" style="margin-top: 10px; width: 100%;" onclick="showClaimModal()">CLAIM REFILL (OUT OF TURN)</button>
    </div>

    <div class="card">
        <h3>Roommates & Credits</h3>
        <div id="memberList"></div>
    </div>

    <div class="card">
        <h3>Add Movie / Important Link</h3>
        <select id="senderName"></select>
        <input type="password" id="senderPin" placeholder="Your PIN">
        <input type="text" id="contentTitle" placeholder="Title">
        <input type="text" id="contentUrl" placeholder="URL">
        <div class="btn-group">
            <button class="btn-primary" onclick="publicAddItem('Movies')">+ Movie</button>
            <button class="btn-primary" onclick="publicAddItem('ImportantLinks')">+ Link</button>
        </div>
    </div>
</div>

<div id="historyOverlay" class="overlay">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <h2>History & Content</h2>
        <button onclick="toggleOverlay('historyOverlay')">Close</button>
    </div>
    <div class="btn-group" style="margin-bottom: 20px;">
        <button class="btn-primary" onclick="renderTab('history')">📜 History</button>
        <button class="btn-primary" onclick="renderTab('movies')">🎬 Movies</button>
        <button class="btn-primary" onclick="renderTab('links')">🔗 Links</button>
    </div>
    <div id="overlayContent"></div>
</div>

<div class="fab" onclick="toggleOverlay('historyOverlay')">📜</div>

<script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_KEY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let members = [];

    // --- 18-Hour Limit Logic ---
    async function checkDailyLimit() {
        const { data, error } = await _supabase.from('History').select('created_at').order('created_at', { ascending: false }).limit(1);
        if (error || data.length === 0) return true;

        const lastRefill = new Date(data[0].created_at).getTime();
        const now = new Date().getTime();
        const diff = now - lastRefill;

        // 18 hours in ms = 64,800,000
        if (diff < 64800000) {
            const h = Math.floor((64800000 - diff) / 3600000);
            const m = Math.floor(((64800000 - diff) % 3600000) / 60000);
            alert(`Limit reached! The group can earn another credit in ${h}h ${m}m.`);
            return false;
        }
        return true;
    }

    async function init() {
        const { data } = await _supabase.from('Roommate').select('*').order('queue_order', { ascending: true });
        members = data || [];
        renderMembers();
        populateDropdowns();
    }

    function renderMembers() {
        const list = document.getElementById('memberList');
        const active = document.getElementById('activeMember');
        list.innerHTML = '';
        members.forEach(m => {
            if (m.is_current) active.innerText = m.name;
            list.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;">
                ${m.name} ${m.is_current ? '🟢' : ''} <span class="badge">${m.points || 0}</span>
            </div>`;
        });
    }

    async function handleAction(type) {
        if (type === 'REFILLED') {
            const canProceed = await checkDailyLimit();
            if (!canProceed) return;
        }

        const pin = prompt(`Enter PIN for ${document.getElementById('activeMember').innerText}:`);
        const current = members.find(m => m.is_current);
        if (pin != current.pin) return alert('Wrong PIN!');

        if (type === 'REFILLED') {
            await _supabase.from('Roommate').update({ points: (current.points || 0) + 1 }).eq('id', current.id);
            await _supabase.from('History').insert([{ name: current.name, action: 'REFILLED', created_at: new Date() }]);
        } else {
            await _supabase.from('History').insert([{ name: current.name, action: 'SKIPPED', created_at: new Date() }]);
        }

        // Rotate turn
        const nextOrder = (current.queue_order % members.length) + 1;
        await _supabase.from('Roommate').update({ is_current: false }).eq('id', current.id);
        await _supabase.from('Roommate').update({ is_current: true }).eq('queue_order', nextOrder);
        init();
    }

    async function showClaimModal() {
        const name = prompt("Select your name to claim credit:");
        const member = members.find(m => m.name === name);
        if (!member) return alert("Member not found");
        
        const pin = prompt(`Enter PIN for ${name}:`);
        if (pin != member.pin) return alert("Wrong PIN!");

        const canProceed = await checkDailyLimit();
        if (!canProceed) return;

        // Earn Credit (Out of Turn)
        await _supabase.from('Roommate').update({ points: (member.points || 0) + 1 }).eq('id', member.id);
        await _supabase.from('History').insert([{ name: member.name, action: 'REFILLED (OUT OF TURN)', created_at: new Date() }]);
        
        // Push turn to next person automatically to keep cycle fair
        const current = members.find(m => m.is_current);
        const nextOrder = (current.queue_order % members.length) + 1;
        await _supabase.from('Roommate').update({ is_current: false }).eq('id', current.id);
        await _supabase.from('Roommate').update({ is_current: true }).eq('queue_order', nextOrder);
        
        init();
    }

    // --- Content Sharing (Movies/Links) ---
    async function publicAddItem(table) {
        const name = document.getElementById('senderName').value;
        const pin = document.getElementById('senderPin').value;
        const title = document.getElementById('contentTitle').value;
        const url = document.getElementById('contentUrl').value;

        const member = members.find(m => m.name === name);
        if (!member || pin != member.pin) return alert("Invalid PIN");
        if (!title || !url) return alert("Fill all fields");

        await _supabase.from(table).insert([{ title, url, uploaded_by: name, created_at: new Date() }]);
        alert("Added successfully!");
        document.getElementById('contentTitle').value = '';
        document.getElementById('contentUrl').value = '';
    }

    // Helpers
    function toggleOverlay(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function populateDropdowns() {
        const selects = ['senderName'];
        selects.forEach(id => {
            const el = document.getElementById(id);
            el.innerHTML = members.map(m => `<option>${m.name}</option>`).join('');
        });
    }

    async function renderTab(tab) {
        const container = document.getElementById('overlayContent');
        container.innerHTML = 'Loading...';
        if (tab === 'history') {
            const { data } = await _supabase.from('History').select('*').order('created_at', { ascending: false });
            container.innerHTML = data.map(h => `<div class="history-card"><b>${h.name}</b>: ${h.action}<br><small>${new Date(h.created_at).toLocaleString()}</small></div>`).join('');
        } else if (tab === 'movies' || tab === 'links') {
            const tableName = tab === 'movies' ? 'Movies' : 'ImportantLinks';
            const { data } = await _supabase.from(tableName).select('*').order('created_at', { ascending: false });
            container.innerHTML = data.map(m => `<div class="history-card"><b>${m.title}</b><br><a href="${m.url}" target="_blank" style="color:cyan;">OPEN LINK</a><br><small>By: ${m.uploaded_by} | ${new Date(m.created_at).toLocaleDateString()}</small></div>`).join('');
        }
    }

    // Secret Settings Trigger
    let holdTimer;
    document.getElementById('titleHeader').addEventListener('mousedown', () => holdTimer = setTimeout(() => alert("Secret Settings: Under development"), 2000));
    document.getElementById('titleHeader').addEventListener('mouseup', () => clearTimeout(holdTimer));

    init();
</script>

</body>
    </html>
