<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Credit System</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <link rel="apple-touch-icon" href="icon-512.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --card: #1a1a1a; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; position: relative; height: fit-content; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.1rem; color: var(--gold); margin: 0; letter-spacing: 1px; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* The Install Button - Hidden by default */
        #install-container { 
            display: none; 
            background: rgba(212, 175, 55, 0.1); 
            padding: 15px; 
            border-radius: 10px; 
            border: 1px solid var(--gold); 
            margin-top: 20px; 
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="secret-trigger">WATER SYSTEM</h1>
    </div>

    <div id="main-content">
        <p style="text-align:center; color:#888;">App is running...</p>
    </div>

    <div id="install-container">
        <p style="margin: 0 0 10px 0; font-size: 0.9rem;">Install for a better experience!</p>
        <button id="install-btn" class="btn-gold">📥 DOWNLOAD APP</button>
    </div>
</div>

<script>
    // 1. REGISTER SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.log('SW Error', err));
        });
    }

    // 2. CAPTURE INSTALL PROMPT
    let deferredPrompt;
    const installContainer = document.getElementById('install-container');
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome from showing its own prompt automatically
        e.preventDefault();
        // Save the event so it can be triggered later
        deferredPrompt = e;
        // Show our custom download UI
        installContainer.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            // Show the official prompt
            deferredPrompt.prompt();
            // Wait for the user to respond to the prompt
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                console.log('User accepted the install');
                installContainer.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });

    // Hide button if app is already installed
    window.addEventListener('appinstalled', () => {
        installContainer.style.display = 'none';
        console.log('App successfully installed');
    });
</script>
</body>
</html>
